<?xml version="1.0" encoding="UTF-8"?>
<!--
  UXC favicon mark.

  A 32x32-friendly square version of the brand wordmark with the canonical
  sunset gradient (warm yellow → orange → coral → magenta → deep purple)
  rendered against the warm-tinted near-black canvas (#0c0807) that matches
  --background. Lowercase "uxc" is drawn as text so the typography stays
  crisp at any rasterized size.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="uxc-sunset" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FFC857"/>
      <stop offset="22%"  stop-color="#FF8A3D"/>
      <stop offset="55%"  stop-color="#FF3D6A"/>
      <stop offset="78%"  stop-color="#B13D8A"/>
      <stop offset="100%" stop-color="#5B2A86"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0c0807"/>
  <text
    x="50%"
    y="55%"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="'Bricolage Grotesque', 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif"
    font-weight="800"
    font-size="34"
    letter-spacing="-2"
    fill="url(#uxc-sunset)"
  >uxc</text>
</svg>
